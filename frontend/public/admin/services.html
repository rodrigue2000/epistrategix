 <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des services - Admin</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1>Gestion des services</h1>
            <nav>
                <a href="dashboard.html">KPI</a>
                <a href="services.html">Services</a>
                <a href="calendrier.html">Calendrier</a>
                <a href="contenus.html">Contenus</a>
                <button id="logoutBtn" class="btn btn-outline btn-sm">Déconnexion</button>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <h2>Créer un nouveau service</h2>
            <form id="serviceForm">
                <!-- ===== INFOS GÉNÉRALES ===== -->
                <div class="form-group">
                    <label>Nom du service</label>
                    <input type="text" id="serviceName" required placeholder="ex: Consulting stratégique">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="serviceDescription" placeholder="Description du service..."></textarea>
                </div>

                <!-- ===== TYPE DE TARIF ===== -->
                <div class="form-group">
                    <label>Type de tarif</label>
                    <select id="priceType">
                        <option value="fixed">Prix fixe</option>
                        <option value="free">Prix libre (gratuit)</option>
                        <option value="unit">Tarification à l'unité de temps</option>
                    </select>
                </div>

                <!-- ===== SECTION PRIX FIXE ===== -->
                <div class="form-group" id="fixedPriceSection">
                    <label>Prix (FCFA) - pour prix fixe uniquement</label>
                    <input type="number" id="servicePrice" placeholder="0" step="1" min="0">
                </div>

                <!-- ===== SECTION TARIFICATION UNITAIRE ===== -->
                <div id="unitPriceSection" style="display:none; border:1px solid #dce7f5; border-radius:1rem; padding:1rem; margin-bottom:1rem; background:#f8faff;">
                    <h4 style="color:#0a2647; margin-bottom:0.8rem;">⚡ Tarification à l'unité de temps</h4>
                    
                    <div class="form-group">
                        <label>Prix par unité de temps (FCFA)</label>
                        <input type="number" id="unitPrice" placeholder="25000" step="1" min="0">
                        <small style="color:#4d6f94;">Ex: 25 000 FCFA par heure</small>
                    </div>
                    
                    <div class="form-group">
                        <label>Durée d'une unité (minutes)</label>
                        <select id="durationUnit">
                            <option value="15">15 minutes</option>
                            <option value="30">30 minutes</option>
                            <option value="45">45 minutes</option>
                            <option value="60" selected>1 heure (60 min)</option>
                            <option value="90">1h30 (90 min)</option>
                            <option value="120">2 heures (120 min)</option>
                        </select>
                    </div>
                    
                    <div style="display:flex; gap:1rem; flex-wrap:wrap;">
                        <div class="form-group" style="flex:1; min-width:100px;">
                            <label>Durée minimale (unités)</label>
                            <input type="number" id="minDuration" value="1" min="1" step="1">
                            <small style="color:#4d6f94;">Minimum 1 unité</small>
                        </div>
                        <div class="form-group" style="flex:1; min-width:100px;">
                            <label>Durée maximale (unités)</label>
                            <input type="number" id="maxDuration" value="4" min="1" step="1">
                            <small style="color:#4d6f94;">Ex: 4 heures max</small>
                        </div>
                    </div>
                </div>

                <!-- ===== DURÉE PAR DÉFAUT ===== -->
                <div class="form-group">
                    <label>Durée par défaut (minutes) - pour les services à prix fixe</label>
                    <input type="number" id="serviceDuration" value="60" min="15" step="15">
                    <small style="color:#4d6f94;">Pour la tarification unitaire, cette valeur est remplacée par l'unité choisie.</small>
                </div>

                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-plus-circle"></i> Ajouter le service
                </button>
                <div id="formError" style="color:#c73b3b; margin-top:0.5rem; display:none;"></div>
            </form>

            <!-- ===== LISTE DES SERVICES EXISTANTS ===== -->
            <h3 style="margin-top: 2rem;">Services existants</h3>
            <div id="servicesList"></div>
        </div>
    </main>

    <script src="../js/admin.js"></script>
    <script>
        // ================================================================
        // CODE SPÉCIFIQUE SERVICES
        // ================================================================

        const API_URL = 'https://epistrategix-backend.onrender.com';

        // ================================================================
        // AFFICHER/MASQUER LES SECTIONS SELON LE TYPE DE TARIF
        // ================================================================
        document.getElementById('priceType').addEventListener('change', function() {
            const value = this.value;
            document.getElementById('fixedPriceSection').style.display = value === 'fixed' ? 'block' : 'none';
            document.getElementById('unitPriceSection').style.display = value === 'unit' ? 'block' : 'none';
            
            // Mettre à jour le label de la durée
            const durationLabel = document.querySelector('label[for="serviceDuration"]');
            if (value === 'unit') {
                durationLabel.textContent = 'Durée par défaut (remplacée par l\'unité)';
            } else {
                durationLabel.textContent = 'Durée par défaut (minutes)';
            }
        });

        // ================================================================
        // AUTHENTIFICATION
        // ================================================================
        firebase.auth().onAuthStateChanged(async (user) => {
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            const token = await user.getIdToken();
            loadServices(token);
        });

        // ================================================================
        // CHARGER LES SERVICES
        // ================================================================
        async function loadServices(token) {
            try {
                const response = await fetch(`${API_URL}/api/services`);
                const services = await response.json();
                const container = document.getElementById('servicesList');
                
                if (services.length === 0) {
                    container.innerHTML = '<p style="text-align:center; color:#4d6f94; padding:2rem;">Aucun service créé.</p>';
                    return;
                }

                container.innerHTML = services.map(s => {
                    let priceDisplay = '';
                    if (s.priceType === 'fixed') {
                        priceDisplay = s.price + ' FCFA (fixe)';
                    } else if (s.priceType === 'free') {
                        priceDisplay = 'Gratuit';
                    } else if (s.priceType === 'unit') {
                        priceDisplay = `${s.unitPrice || 0} FCFA/${s.durationUnit || 60}min (unitaire)`;
                    } else {
                        priceDisplay = 'Prix libre';
                    }
                    
                    return `
                    <div style="background:white; border-radius:1rem; padding:1.2rem; margin-bottom:1rem; border:1px solid #e2ebf6; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:0.5rem;">
                        <div>
                            <strong>${s.name}</strong>
                            <span style="color:#4d6f94; font-size:0.9rem; margin-left:1rem;">
                                ${priceDisplay}
                                · ${s.duration || 60} min
                                ${s.priceType === 'unit' ? `· min:${s.minDuration || 1} max:${s.maxDuration || 4}` : ''}
                            </span>
                        </div>
                        <div style="display:flex; gap:0.5rem;">
                            <button onclick="editService('${s.id}')" class="btn btn-outline btn-sm">
                                <i class="fas fa-pen"></i>
                            </button>
                            <button onclick="deleteService('${s.id}')" class="btn btn-danger btn-sm">
                                <i class="fas fa-trash-alt"></i>
                            </button>
                        </div>
                    </div>
                `}).join('');
            } catch (error) {
                console.error('Erreur chargement services:', error);
                document.getElementById('servicesList').innerHTML = '<p style="color:#c73b3b;">Erreur de chargement des services.</p>';
            }
        }

        // ================================================================
        // AJOUTER UN SERVICE
        // ================================================================
        document.getElementById('serviceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = firebase.auth().currentUser;
            if (!user) return;

            const name = document.getElementById('serviceName').value.trim();
            const description = document.getElementById('serviceDescription').value.trim();
            const priceType = document.getElementById('priceType').value;
            const price = parseFloat(document.getElementById('servicePrice').value);
            const duration = parseInt(document.getElementById('serviceDuration').value) || 60;
            const errorDiv = document.getElementById('formError');
            
            errorDiv.style.display = 'none';
            errorDiv.textContent = '';

            // Validation
            if (!name) {
                errorDiv.textContent = '⚠️ Le nom est requis.';
                errorDiv.style.display = 'block';
                return;
            }

            // Construction du payload
            const payload = { name, description, priceType, duration };

            if (priceType === 'fixed') {
                if (isNaN(price) || price < 0) {
                    errorDiv.textContent = '⚠️ Veuillez entrer un prix valide.';
                    errorDiv.style.display = 'block';
                    return;
                }
                payload.price = price;
            } else if (priceType === 'unit') {
                const unitPrice = parseFloat(document.getElementById('unitPrice').value);
                const durationUnit = parseInt(document.getElementById('durationUnit').value);
                const minDuration = parseInt(document.getElementById('minDuration').value) || 1;
                const maxDuration = parseInt(document.getElementById('maxDuration').value) || 4;

                if (isNaN(unitPrice) || unitPrice < 0) {
                    errorDiv.textContent = '⚠️ Veuillez entrer un prix unitaire valide.';
                    errorDiv.style.display = 'block';
                    return;
                }
                if (minDuration > maxDuration) {
                    errorDiv.textContent = '⚠️ La durée minimale ne peut pas être supérieure à la durée maximale.';
                    errorDiv.style.display = 'block';
                    return;
                }
                payload.unitPrice = unitPrice;
                payload.durationUnit = durationUnit;
                payload.minDuration = minDuration;
                payload.maxDuration = maxDuration;
                payload.price = null;
            } else {
                // free
                payload.price = null;
            }

            try {
                const token = await user.getIdToken();
                const response = await fetch(`${API_URL}/api/services`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Erreur lors de la création');
                }

                alert('✅ Service créé avec succès');
                document.getElementById('serviceForm').reset();
                loadServices(token);
            } catch (error) {
                errorDiv.textContent = '❌ ' + error.message;
                errorDiv.style.display = 'block';
            }
        });

        // ================================================================
        // MODIFIER UN SERVICE
        // ================================================================
        window.editService = async function(id) {
            const user = firebase.auth().currentUser;
            if (!user) return;

            try {
                const token = await user.getIdToken();
                const response = await fetch(`${API_URL}/api/services`);
                const services = await response.json();
                const service = services.find(s => s.id === id);
                if (!service) {
                    alert('Service non trouvé');
                    return;
                }

                const newName = prompt('Nouveau nom:', service.name);
                if (newName === null) return;
                
                let updated = { name: newName.trim() };

                if (service.priceType === 'fixed') {
                    const newPrice = prompt('Nouveau prix (FCFA):', service.price);
                    if (newPrice === null) return;
                    updated.price = parseFloat(newPrice);
                } else if (service.priceType === 'unit') {
                    const newUnitPrice = prompt('Nouveau prix unitaire (FCFA):', service.unitPrice);
                    if (newUnitPrice === null) return;
                    updated.unitPrice = parseFloat(newUnitPrice);
                }

                const updateResponse = await fetch(`${API_URL}/api/services/${id}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(updated)
                });

                if (!updateResponse.ok) {
                    const error = await updateResponse.json();
                    throw new Error(error.error || 'Erreur lors de la modification');
                }

                alert('✅ Service modifié avec succès');
                loadServices(token);
            } catch (error) {
                alert('❌ Erreur: ' + error.message);
            }
        };

        // ================================================================
        // SUPPRIMER UN SERVICE
        // ================================================================
        window.deleteService = async function(id) {
            const user = firebase.auth().currentUser;
            if (!user) return;

            if (!confirm('Supprimer ce service ?')) return;

            try {
                const token = await user.getIdToken();
                const response = await fetch(`${API_URL}/api/services/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || 'Erreur lors de la suppression');
                }

                alert('✅ Service supprimé');
                loadServices(token);
            } catch (error) {
                alert('❌ Erreur: ' + error.message);
            }
        };
    </script>
</body>
</html>
