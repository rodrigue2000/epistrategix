<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retrouver mes achats - EpiStrategix</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><i class="fas fa-user-tie"></i> EpiStrategix</h1>
            <nav>
                <a href="index.html">Accueil</a>
                <a href="reservation.html">Réserver</a>
                <a href="bibliotheque.html">Bibliothèque</a>
                <a href="support.html">Support</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container" style="max-width: 500px; margin: 0 auto; padding: 3rem 1rem;">
            <h2 style="text-align:center;">🔑 Retrouver mes achats</h2>
            <p style="color:#3e6188; text-align:center; margin-bottom:2rem;">
                Entrez l'email utilisé lors de votre achat. Nous vous enverrons un lien sécurisé
                pour retrouver vos fichiers, sans avoir à payer à nouveau.
            </p>

            <form id="requestForm">
                <div class="form-group">
                    <label>Votre email</label>
                    <input type="email" id="email" required placeholder="vous@exemple.com" style="width:100%; padding:0.7rem; border-radius:12px; border:1px solid #dce7f5;">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center; padding:0.9rem;">
                    <i class="fas fa-paper-plane"></i> Recevoir le lien par email
                </button>
            </form>

            <div id="resultMessage" style="margin-top:1.5rem; display:none;"></div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 EpiStrategix - Tous droits réservés</p>
            <p style="margin-top:0.5rem; font-size:0.85rem;">
                <a href="cgu.html">CGU</a> · <a href="confidentialite.html">Confidentialité</a> · <a href="support.html">Support</a>
            </p>
        </div>
    </footer>

    <script>
        const API_URL = 'https://epistrategix-backend.onrender.com';

        document.getElementById('requestForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const resultDiv = document.getElementById('resultMessage');
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalHtml = submitBtn.innerHTML;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Envoi en cours...';
            resultDiv.style.display = 'none';

            try {
                const response = await fetch(`${API_URL}/api/purchases/request-access`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                resultDiv.style.display = 'block';
                if (response.ok) {
                    resultDiv.style.color = '#1f9a6e';
                    resultDiv.innerHTML = `
                        <i class="fas fa-check-circle"></i>
                        Si cet email correspond à des achats, un lien vient de lui être envoyé.
                        Vérifiez votre boîte de réception (et vos spams).
                    `;
                    document.getElementById('requestForm').reset();
                } else {
                    resultDiv.style.color = '#c73b3b';
                    resultDiv.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${data.error}`;
                }
            } catch (error) {
                resultDiv.style.display = 'block';
                resultDiv.style.color = '#c73b3b';
                resultDiv.innerHTML = '<i class="fas fa-exclamation-circle"></i> Erreur réseau, veuillez réessayer.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = originalHtml;
            }
        });
    </script>
</body>
</html>
