 <!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EpiStrategix - Conseil & Services</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><i class="fas fa-user-tie"></i> EpiStrategix</h1>
            <nav>
                <a href="index.html">Accueil</a>
                <a href="reservation.html">Réserver</a>
                <a href="bibliotheque.html">Bibliothèque</a>
               <a href="admin/login.html" class="btn-admin">Admin</a>
            </nav>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h2>Votre partenaire stratégique</h2>
                <p>Découvrez nos services de conseil et réservez votre session dès maintenant.</p>
                <a href="reservation.html" class="btn btn-primary">Réserver un créneau</a>
            </div>
        </section>

        <section id="services" class="services">
            <div class="container">
                <h2>Nos prestations</h2>
                <div id="servicesList" class="grid"></div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 EpiStrategix - Tous droits réservés</p>
        </div>
    </footer>

    <script>
        const API_URL = 'https://epistrategix-backend.onrender.com';
        
        fetch(`${API_URL}/api/services`)
            .then(res => res.json())
            .then(services => {
                const container = document.getElementById('servicesList');
                services.forEach(service => {
                    const card = document.createElement('div');
                    card.className = 'service-card';
                    card.innerHTML = `
                        <h3>${service.name}</h3>
                        <p>${service.description || ''}</p>
                        <p class="price">${service.priceType === 'fixed' ? service.price + ' FCFA' : 'Prix libre'}</p>
                        <a href="reservation.html?service=${service.id}" class="btn btn-secondary">Réserver</a>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(error => {
                console.error('Erreur:', error);
                document.getElementById('servicesList').innerHTML = 
                    '<p style="text-align:center; color:#c73b3b;">❌ Erreur de chargement des services</p>';
            });
    </script>
</body>
</html>
