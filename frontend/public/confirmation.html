<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation - EpiStrategix</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><i class="fas fa-user-tie"></i> EpiStrategix</h1>
            <nav>
                <a href="index.html">Accueil</a>
                <a href="reservation.html">Réserver</a>
                <a href="bibliotheque.html">Bibliothèque</a>
                <a href="support.html">Support</a>
                <a href="admin/dashboard.html" class="btn-admin">Admin</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container" style="text-align: center; padding: 3rem 1rem;">
            <div id="confirmationContent">
                <!-- Rempli dynamiquement par le script ci-dessous -->
                <div style="font-size: 5rem; color: #4d6f94; margin-bottom: 1.5rem;">
                    <i class="fas fa-spinner fa-spin"></i>
                </div>
                <h2 style="font-size: 2rem; margin-bottom: 1rem;">Vérification en cours...</h2>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 EpiStrategix - Tous droits réservés</p>
            <p style="margin-top:0.5rem; font-size:0.85rem;">
                <a href="cgu.html">CGU</a> · <a href="confidentialite.html">Confidentialité</a> · <a href="support.html">Support</a>
            </p>
        </div>
    </footer>

    <script>
        const API_URL = 'https://epistrategix-backend.onrender.com';

        const params = new URLSearchParams(window.location.search);
        const status = params.get('status');
        const type = params.get('type');
        const transactionId = params.get('transaction');

        const container = document.getElementById('confirmationContent');

        function navLinks() {
            return `
                <div style="display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
                    <a href="index.html" class="btn btn-primary">
                        <i class="fas fa-home"></i> Retour à l'accueil
                    </a>
                    <a href="bibliotheque.html" class="btn btn-secondary">
                        <i class="fas fa-book"></i> Bibliothèque
                    </a>
                    <a href="reservation.html" class="btn btn-outline">
                        <i class="fas fa-calendar-plus"></i> Nouvelle réservation
                    </a>
                </div>
            `;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        // ✅ Force le téléchargement (au lieu de l'ouverture dans le navigateur)
        // en insérant le flag Cloudinary "fl_attachment" dans l'URL, ce qui fait
        // renvoyer l'en-tête Content-Disposition: attachment par le serveur.
        function toDownloadUrl(url) {
            if (!url || !url.includes('/upload/')) return url;
            if (url.includes('fl_attachment')) return url; // déjà présent
            return url.replace('/upload/', '/upload/fl_attachment/');
        }

        function renderReservationSuccess() {
            container.innerHTML = `
                <div style="font-size: 5rem; color: #1f9a6e; margin-bottom: 1.5rem;">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h2 style="font-size: 2rem; margin-bottom: 1rem;">Paiement confirmé !</h2>
                <p style="font-size: 1.1rem; color: #3e6188; max-width: 500px; margin: 0 auto 2rem;">
                    Votre réservation a été enregistrée avec succès. Vous recevrez une confirmation avec tous les détails.
                </p>
                ${navLinks()}
                <div style="margin-top: 2.5rem; padding: 1.5rem; background: #f8faff; border-radius: 1rem; border: 1px solid #e2ebf6; max-width: 500px; margin-left: auto; margin-right: auto;">
                    <p style="font-size: 0.9rem; color: #4d6f94;">
                        <i class="fas fa-info-circle"></i> Pour toute question, contactez-nous via WhatsApp.
                    </p>
                </div>
            `;
        }

        function renderContentSuccess(data) {
            container.innerHTML = `
                <div style="font-size: 5rem; color: #1f9a6e; margin-bottom: 1.5rem;">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h2 style="font-size: 2rem; margin-bottom: 1rem;">Achat confirmé !</h2>
                <p style="font-size: 1.1rem; color: #3e6188; max-width: 500px; margin: 0 auto 1.5rem;">
                    Merci pour votre achat de <strong>${escapeHtml(data.contentTitle)}</strong>.
                </p>
                <a href="${toDownloadUrl(data.contentUrl)}" class="btn btn-success" style="margin-bottom:1.5rem; display:inline-flex; align-items:center; gap:0.5rem;">
                    <i class="fas fa-download"></i> Télécharger maintenant
                </a>
                <br>
                ${navLinks()}
            `;
        }

        function renderBundleSuccess(data) {
            const itemsHtml = (data.items || []).map(item => `
                <div style="display:flex; justify-content:space-between; align-items:center; background:#f8faff; border:1px solid #e2ebf6; border-radius:1rem; padding:0.8rem 1rem; margin-bottom:0.6rem;">
                    <span style="color:#0a2647; font-weight:500;">${escapeHtml(item.title)}</span>
                    <a href="${toDownloadUrl(item.url)}" class="btn btn-success btn-sm" style="display:inline-flex; align-items:center; gap:0.4rem;">
                        <i class="fas fa-download"></i> Télécharger
                    </a>
                </div>
            `).join('');

            container.innerHTML = `
                <div style="font-size: 5rem; color: #1f9a6e; margin-bottom: 1.5rem;">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h2 style="font-size: 2rem; margin-bottom: 1rem;">Achat confirmé !</h2>
                <p style="font-size: 1.1rem; color: #3e6188; max-width: 500px; margin: 0 auto 1.2rem;">
                    Merci pour votre achat du pack <strong>${escapeHtml(data.bundleTitle)}</strong>.
                    Voici vos ${(data.items || []).length} fichiers :
                </p>
                <div style="max-width: 500px; margin: 0 auto 1.5rem;">
                    ${itemsHtml}
                </div>
                ${navLinks()}
            `;
        }

        function renderPending() {
            container.innerHTML = `
                <div style="font-size: 5rem; color: #e0a800; margin-bottom: 1.5rem;">
                    <i class="fas fa-hourglass-half"></i>
                </div>
                <h2 style="font-size: 2rem; margin-bottom: 1rem;">Paiement en cours de traitement</h2>
                <p style="font-size: 1.1rem; color: #3e6188; max-width: 500px; margin: 0 auto 2rem;">
                    Merci de patienter quelques instants, votre confirmation arrive...
                </p>
            `;
        }

        function renderError(message) {
            container.innerHTML = `
                <div style="font-size: 5rem; color: #c73b3b; margin-bottom: 1.5rem;">
                    <i class="fas fa-exclamation-circle"></i>
                </div>
                <h2 style="font-size: 2rem; margin-bottom: 1rem;">Une erreur est survenue</h2>
                <p style="font-size: 1.1rem; color: #3e6188; max-width: 500px; margin: 0 auto 2rem;">
                    ${escapeHtml(message)}
                </p>
                ${navLinks()}
            `;
        }

        async function fetchContentPurchase(id, attemptsLeft = 5) {
            try {
                const res = await fetch(`${API_URL}/api/contents/transaction/${id}`);
                const data = await res.json();

                if (!res.ok) {
                    renderError(data.error || 'Impossible de récupérer votre achat.');
                    return;
                }

                if (data.status === 'approved') {
                    renderContentSuccess(data);
                } else if (attemptsLeft > 0) {
                    // Le webhook FedaPay n'a peut-être pas encore traité l'événement, on retente
                    renderPending();
                    setTimeout(() => fetchContentPurchase(id, attemptsLeft - 1), 2000);
                } else {
                    renderError('Le paiement est en cours de vérification. Rafraîchissez cette page dans un instant.');
                }
            } catch (err) {
                renderError('Erreur réseau, veuillez réessayer.');
            }
        }

        async function fetchBundlePurchase(id, attemptsLeft = 5) {
            try {
                const res = await fetch(`${API_URL}/api/bundles/transaction/${id}`);
                const data = await res.json();

                if (!res.ok) {
                    renderError(data.error || 'Impossible de récupérer votre achat.');
                    return;
                }

                if (data.status === 'approved') {
                    renderBundleSuccess(data);
                } else if (attemptsLeft > 0) {
                    renderPending();
                    setTimeout(() => fetchBundlePurchase(id, attemptsLeft - 1), 2000);
                } else {
                    renderError('Le paiement est en cours de vérification. Rafraîchissez cette page dans un instant.');
                }
            } catch (err) {
                renderError('Erreur réseau, veuillez réessayer.');
            }
        }

        // ================================================================
        // ROUTAGE SELON LES PARAMÈTRES D'URL
        // ================================================================
        if (status === 'success' && type === 'content' && transactionId) {
            fetchContentPurchase(transactionId);
        } else if (status === 'success' && type === 'bundle' && transactionId) {
            fetchBundlePurchase(transactionId);
        } else if (status === 'success') {
            renderReservationSuccess();
        } else {
            renderError('Le paiement n\'a pas abouti. Vous pouvez réessayer.');
        }
    </script>
</body>
</html>
