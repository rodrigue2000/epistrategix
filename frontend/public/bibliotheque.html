<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliothèque - EpiStrategix</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1><i class="fas fa-user-tie"></i> EpiStrategix</h1>
            <nav>
                <a href="index.html">Accueil</a>
                <a href="reservation.html">Réserver</a>
                <a href="bibliotheque.html">Bibliothèque</a>
                <a href="admin/dashboard.html" class="btn-admin">Admin</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <h2>Bibliothèque de contenus</h2>
            <div id="contentsList" class="grid">
                <!-- Contenus chargés dynamiquement -->
            </div>
        </div>
    </main>

    <script>
        const API_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:5000' 
            : 'https://votre-backend.onrender.com';
            
        fetch(`${API_URL}/api/contents`)
            .then(res => res.json())
            .then(contents => {
                const container = document.getElementById('contentsList');
                contents.forEach(content => {
                    const card = document.createElement('div');
                    card.className = 'content-card';
                    card.innerHTML = `
                        <h3>${content.title}</h3>
                        <p>${content.priceType === 'free' ? '📄 Gratuit' : '💰 ' + content.price + ' €'}</p>
                        <a href="${content.url}" target="_blank" class="btn btn-secondary">
                            ${content.priceType === 'free' ? 'Télécharger' : 'Acheter'}
                        </a>
                    `;
                    container.appendChild(card);
                });
            });
    </script>
</body>
</html>
