<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bibliothèque - EpiStrategix</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- ✅ Le SDK FedaPay checkout.js n'est plus nécessaire :
         le paiement se fait maintenant par redirection vers l'URL générée par le backend -->
</head>
<body>
    <header>
        <div class="container">
            <h1><i class="fas fa-user-tie"></i> EpiStrategix</h1>
            <nav>
                <a href="index.html">Accueil</a>
                <a href="reservation.html">Réserver</a>
                <a href="bibliotheque.html">Bibliothèque</a>
                <a href="admin/login.html" class="btn-admin">Admin</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <h2>📚 Bibliothèque de contenus</h2>
            <p style="color:#3e6188; margin-bottom:1.2rem;">
                Téléchargez des ressources gratuites ou achetez des contenus premium.
            </p>
            <div id="contentsList" class="grid"></div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2025 EpiStrategix - Tous droits réservés</p>
        </div>
    </footer>

    <script>
        const API_URL = 'https://epistrategix-backend.onrender.com';

        const SOLUTION_TYPE_LABELS = {
            guide: 'Guide',
            livre: 'Livre',
            formation: 'Formation',
            template: 'Modèle / Template',
            checklist: 'Checklist',
            etude_cas: 'Étude de cas',
            autre: 'Autre'
        };

        // ================================================================
        // CHARGER LES CONTENUS
        // ================================================================
        fetch(`${API_URL}/api/contents`)
            .then(res => res.json())
            .then(contents => {
                const container = document.getElementById('contentsList');
                container.innerHTML = '';

                if (contents.length === 0) {
                    container.innerHTML = `
                        <div class="empty-state" style="grid-column:1/-1;">
                            <i class="fas fa-box-open"></i>
                            <p>Aucun contenu disponible pour le moment.</p>
                        </div>
                    `;
                    return;
                }

                contents.forEach(content => {
                    const card = document.createElement('div');
                    card.className = 'content-card';

                    const isFree = content.priceType === 'free';
                    const priceDisplay = isFree ? '📄 Gratuit' : `💰 ${content.price || 0} FCFA`;
                    const buttonText = isFree ? 'Télécharger' : 'Acheter';
                    const buttonClass = isFree ? 'btn btn-secondary' : 'btn btn-success';

                    card.innerHTML = `
                        <h3>${escapeHtml(content.title)}</h3>
                        <p style="color:#4d6f94; font-size:0.9rem;">
                            ${content.type || 'Fichier'}
                            ${content.solutionType ? ` · ${SOLUTION_TYPE_LABELS[content.solutionType] || content.solutionType}` : ''}
                        </p>
                        <p style="font-size:1.2rem; font-weight:700; color:${isFree ? '#1f9a6e' : '#1e5fb0'};">
                            ${priceDisplay}
                        </p>
                        <button class="${buttonClass}" onclick="handleContentAction('${content.id}', '${content.priceType}', ${content.price || 0}, '${content.url}', '${escapeHtml(content.title)}')" style="width:100%; justify-content:center;">
                            ${isFree ? '<i class="fas fa-download"></i>' : '<i class="fas fa-shopping-cart"></i>'} ${buttonText}
                        </button>
                    `;
                    container.appendChild(card);
                });
            })
            .catch(err => {
                console.error('Erreur chargement contenus:', err);
                document.getElementById('contentsList').innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1;">
                        <i class="fas fa-exclamation-triangle" style="color:#c73b3b;"></i>
                        <p style="color:#c73b3b;">Erreur de chargement des contenus. Veuillez réessayer.</p>
                    </div>
                `;
            });

        // ✅ Force le téléchargement (au lieu de l'ouverture dans le navigateur)
        // en insérant le flag Cloudinary "fl_attachment" dans l'URL.
        function toDownloadUrl(url) {
            if (!url || !url.includes('/upload/')) return url;
            if (url.includes('fl_attachment')) return url;
            return url.replace('/upload/', '/upload/fl_attachment/');
        }

        // ================================================================
        // ÉCHAPPER LE HTML
        // ================================================================
        function escapeHtml(text) {
            if (!text) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }

        // ================================================================
        // GESTION DE L'ACTION SUR UN CONTENU (VERSION CORRIGÉE)
        // ================================================================
        // ✅ On ne recrée plus de transaction côté client avec FedaPay.init().
        //    On redirige simplement vers l'URL de paiement générée par le backend,
        //    qui contient déjà metadata.contentId — indispensable pour que le
        //    webhook FedaPay sache quel contenu marquer comme acheté.
        async function handleContentAction(contentId, priceType, price, url, title) {
            if (priceType === 'free') {
                window.open(toDownloadUrl(url), '_blank');
                return;
            }

            try {
                const response = await fetch(`${API_URL}/api/contents/purchase`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contentId: contentId,
                        customerName: 'Client',
                        customerEmail: 'client@exemple.com'
                    })
                });

                const data = await response.json();

                if (!response.ok || !data.url) {
                    alert('❌ Erreur: ' + (data.error || 'Impossible d\'initier le paiement'));
                    return;
                }

                // ✅ Redirection vers la transaction créée côté backend
                window.location.href = data.url;

            } catch (error) {
                console.error('❌ Erreur:', error);
                alert('❌ Erreur lors de l\'ouverture du paiement: ' + error.message);
            }
        }
    </script>
</body>
</html>
