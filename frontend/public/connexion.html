<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - EpiStrategix</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1><i class="fas fa-user-tie"></i> EpiStrategix</h1>
            <nav>
                <a href="index.html">Accueil</a>
                <a href="bibliotheque.html">Bibliothèque</a>
                <a href="formations.html">Formations</a>
                <a href="mon-compte.html">Mon compte</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container" style="max-width: 450px; margin: 0 auto; padding: 3rem 1rem;">
            <div style="display:flex; gap:0.5rem; margin-bottom:1.5rem;">
                <button id="tabLogin" class="btn btn-primary" style="flex:1; justify-content:center;">Connexion</button>
                <button id="tabSignup" class="btn btn-outline" style="flex:1; justify-content:center;">Créer un compte</button>
            </div>

            <form id="authForm">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="authEmail" required style="width:100%; padding:0.6rem; border-radius:12px; border:1px solid #dce7f5;">
                </div>
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="authPassword" required minlength="6" style="width:100%; padding:0.6rem; border-radius:12px; border:1px solid #dce7f5;">
                </div>
                <button type="submit" id="authSubmitBtn" class="btn btn-primary" style="width:100%; justify-content:center; padding:0.8rem;">
                    Se connecter
                </button>
                <div id="authError" style="color:#c73b3b; margin-top:0.8rem; display:none;"></div>
            </form>

            <div style="text-align:center; color:#7b95b5; margin:1.2rem 0; font-size:0.85rem;">— ou —</div>

            <button id="googleSignInBtn" class="btn btn-outline" style="width:100%; justify-content:center; padding:0.8rem;">
                <i class="fab fa-google"></i> Continuer avec Google
            </button>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 EpiStrategix - Tous droits réservés</p>
        </div>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBOSqW6uNLITd-ojr9GL_pUwILXRQ6Q-d0",
            authDomain: "epistrategix.firebaseapp.com",
            projectId: "epistrategix",
            storageBucket: "epistrategix.firebasestorage.app",
            messagingSenderId: "469383955380",
            appId: "1:469383955380:web:b9166a029f49eb5d8468e1"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);

        let mode = 'login';

        document.getElementById('tabLogin').addEventListener('click', () => {
            mode = 'login';
            document.getElementById('tabLogin').className = 'btn btn-primary';
            document.getElementById('tabSignup').className = 'btn btn-outline';
            document.getElementById('authSubmitBtn').textContent = 'Se connecter';
        });
        document.getElementById('tabSignup').addEventListener('click', () => {
            mode = 'signup';
            document.getElementById('tabSignup').className = 'btn btn-primary';
            document.getElementById('tabLogin').className = 'btn btn-outline';
            document.getElementById('authSubmitBtn').textContent = 'Créer mon compte';
        });

        firebase.auth().onAuthStateChanged(user => {
            if (user) window.location.href = 'mon-compte.html';
        });

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;
            const errorDiv = document.getElementById('authError');
            errorDiv.style.display = 'none';

            try {
                if (mode === 'signup') {
                    await firebase.auth().createUserWithEmailAndPassword(email, password);
                } else {
                    await firebase.auth().signInWithEmailAndPassword(email, password);
                }
                window.location.href = 'mon-compte.html';
            } catch (error) {
                errorDiv.textContent = translateAuthError(error.code) || error.message;
                errorDiv.style.display = 'block';
            }
        });

        document.getElementById('googleSignInBtn').addEventListener('click', async () => {
            const provider = new firebase.auth.GoogleAuthProvider();
            try {
                await firebase.auth().signInWithPopup(provider);
                window.location.href = 'mon-compte.html';
            } catch (error) {
                document.getElementById('authError').textContent = 'Erreur de connexion Google: ' + error.message;
                document.getElementById('authError').style.display = 'block';
            }
        });

        function translateAuthError(code) {
            const map = {
                'auth/email-already-in-use': 'Cet email a déjà un compte — essayez de vous connecter.',
                'auth/invalid-email': 'Adresse email invalide.',
                'auth/weak-password': 'Le mot de passe doit contenir au moins 6 caractères.',
                'auth/user-not-found': 'Aucun compte trouvé avec cet email.',
                'auth/wrong-password': 'Mot de passe incorrect.',
                'auth/invalid-credential': 'Email ou mot de passe incorrect.',
            };
            return map[code];
        }
    </script>
</body>
</html>
